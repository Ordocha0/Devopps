# ===========================
# Namespace
# ===========================
apiVersion: v1
kind: Namespace
metadata:
  name: issue-app-frotend

---
# ===========================
# ConfigMap (Non-Sensitive)
# ===========================
apiVersion: v1
kind: ConfigMap
metadata:
  name: issue-app-frotend-config
  namespace: issue-app-frotend
data:
  PORT: "80"
  NODE_ENV: "production"

---
# ===========================
# Frontend Deployment
# ===========================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: issue-app-frotend-app
  namespace: issue-app-frotend
  labels:
    smart-restart.io/enabled: "true"         # Tells the engine to look at this app
  annotations:
    smart-restart.io/max-retries: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: issue-app-frotend
  template:
    metadata:
      labels:
        app: issue-app-frotend
    spec:
      imagePullSecrets:
        - name: ghcr-secret   # <--- Added this
      containers:
        - name: issue-app-frotend
          image: ghcr.io/ordocha0/issue-tracking-frontend:e098110254df16f295c59f9e7bb2a437066f82f9
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          # envFrom:
          #   - configMapRef:
          #       name: issue-app-frotend-config
          # command: ["npm"]
          # args: ["run", "dev", "--", "--host=0.0.0.0"]
          # readinessProbe optional
          # readinessProbe:
          #   httpGet:
          #     path: /
          #     port: 80
          #   initialDelaySeconds: 5
          #   periodSeconds: 10

---
# ===========================
# Frontend Service
# ===========================
apiVersion: v1
kind: Service
metadata:
  name: issue-app-frotend-service
  namespace: issue-app-frotend
spec:
  selector:
    app: issue-app-frotend
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
